[workspace]
members = ["crates/serpis-ai", "crates/serpis-agent", "crates/serpis", "crates/serpis-bin", "examples/plugins/hello"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serpis-ai = { path = "crates/serpis-ai" }
serpis-agent = { path = "crates/serpis-agent" }
serpis = { path = "crates/serpis" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-util = "0.7"
tracing = "0.1"
dirs = "6"
regex = "1"
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
