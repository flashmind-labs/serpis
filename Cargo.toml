[workspace]
members = ["crates/serpis-ai", "crates/serpis-proto", "crates/serpis-chat", "crates/serpis-node", "crates/serpis-agent", "crates/serpis", "crates/serpis-bin", "crates/serpis-testkit", "crates/serpis-mobile", "examples/plugins/hello"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serpis-ai = { path = "crates/serpis-ai" }
serpis-proto = { path = "crates/serpis-proto" }
serpis-agent = { path = "crates/serpis-agent" }
serpis-chat = { path = "crates/serpis-chat" }
serpis-node = { path = "crates/serpis-node" }
serpis = { path = "crates/serpis" }
serpis-testkit = { path = "crates/serpis-testkit" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-util = "0.7"
tracing = "0.1"
dirs = "6"
regex = "1"
uuid = { version = "1", features = ["v4", "v7"] }
base64 = "0.22"
# Terminals: manymux's node holds them (`serpis-node terminals`), its client feeds the terminal buffer.
manymux = { version = "=0.2.1", default-features = false }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
