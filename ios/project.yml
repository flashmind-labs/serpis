# The Xcode project, generated by XcodeGen (`xcodegen` in this directory) and not checked in:
# this file is the project.
name: Serpis
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Markdown as answers use it, tables included (GitHub's dialect, through cmark-gfm).
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
configFiles:
  Debug: Serpis.xcconfig
  Release: Serpis.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Serpis:
    type: application
    platform: iOS
    sources:
      - path: Serpis
      # Generated from the compiled core by build-rust.sh, which runs first.
      - path: build/SerpisCore.swift
        group: Generated
    dependencies:
      - package: MarkdownUI
      - framework: build/SerpisCore.xcframework
        embed: false
      # What the core's randomness and the device key's keeping draw on.
      - sdk: Security.framework
    preBuildScripts:
      - name: Rust core
        script: '"$SRCROOT/build-rust.sh" "$SRCROOT/build"'
        # Always run, and leave the deciding to cargo.
        basedOnDependencyAnalysis: false
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Serpis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Asked the first time the app reaches a machine on the same network.
        NSLocalNetworkUsageDescription: Serpis reaches your machines over SSH.
        NSPhotoLibraryUsageDescription: Photos you pick go to the chat.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serpis.phone$(SERPIS_BUNDLE_SUFFIX)
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The pre-build script writes into build/, outside what a sandboxed script may touch.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  SerpisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SerpisTests
    dependencies:
      - target: Serpis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serpis.phone$(SERPIS_BUNDLE_SUFFIX).tests
        GENERATE_INFOPLIST_FILE: YES
  SerpisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SerpisUITests
    dependencies:
      - target: Serpis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.serpis.phone$(SERPIS_BUNDLE_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Serpis
schemes:
  Serpis:
    build:
      targets:
        Serpis: all
        SerpisTests: [test]
        SerpisUITests: [test]
    test:
      targets:
        - SerpisTests
        - SerpisUITests
