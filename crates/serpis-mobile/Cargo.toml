[package]
name = "serpis-mobile"
description = "The phone app's core: ssh in-process to machines, and serpis's protocol client over it, for Swift through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# staticlib for the iOS app; lib for the tests and the bindgen binary.
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
serpis-node = { workspace = true, default-features = false }
serpis-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
uniffi = { version = "0.32.2", features = ["tokio", "cli"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }

[dev-dependencies]
futures.workspace = true
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
serpis-testkit = { path = "../serpis-testkit" }
