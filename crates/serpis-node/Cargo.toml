[package]
name = "serpis-node"
description = "The headless serpis node: runs chats on a machine for clients elsewhere (the desktop, the iOS app), reached over its socket or `ssh <host> serpis-node agent`"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "serpis-node"
path = "src/main.rs"
required-features = ["node"]

[features]
default = ["node"]
# The node itself: chats, Lua, terminals, the service. Without it, the crate is the protocol
# client and nothing more, which is what the phone app links (crates/serpis-mobile).
node = ["dep:serpis-ai", "dep:serpis-agent", "dep:serpis-chat", "dep:futures", "dep:uuid", "dep:base64", "dep:tracing-subscriber", "dep:nix", "dep:mlua", "dep:avt"]

[dependencies]
serpis-ai = { workspace = true, optional = true }
serpis-agent = { workspace = true, optional = true }
serpis-chat = { workspace = true, optional = true }
serpis-proto.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
futures = { workspace = true, optional = true }
tracing.workspace = true
dirs.workspace = true
uuid = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
nix = { version = "0.29", features = ["hostname", "process", "user", "term", "signal", "fs", "ioctl"], optional = true }
sha2 = "0.10"
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize"], optional = true }
# A terminal's screen, kept to paint a view that attaches (crate::terminals).
avt = { version = "0.18", optional = true }

[dev-dependencies]
serpis-testkit.workspace = true
