[package]
name = "serpis"
description = "Serpis editor core: buffers, windows, keymaps, commands, hooks, Lua and Rust extensions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# A Rust dylib so the host binary and every Rust plugin share one copy of the core.
crate-type = ["dylib"]

[dependencies]
serpis-ai.workspace = true
serpis-agent.workspace = true
serpis-proto.workspace = true
serpis-chat.workspace = true
serpis-node.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
dirs.workspace = true
regex.workspace = true
similar = "2"
uuid.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "links", "default_fonts", "system_fonts", "wayland", "x11"] }
egui = "0.37"
fontique = { version = "0.11", default-features = false, features = ["system", "fontconfig-dlopen"] }
# LuaJIT (Lua 5.1 + extensions), like Neovim: fast, and familiar to plugin authors.
mlua = { version = "0.11", features = ["luajit", "vendored", "serialize"] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", features = ["kitty-graphics", "png"] }
nix = { version = "0.29", features = ["term", "fs", "signal", "process", "ioctl", "hostname"] }
libloading = "0.8"
notify = "8"
ropey = "1.6"
slotmap = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arboard = "3"
url = "2"
base64.workspace = true
# The code a phone scans to pair (pairing.rs).
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Syntax highlighting: syntect with bat's grammars (two-face), pure-Rust regexes.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same winit as eframe; used to drop the default app menu (Cmd-H/Cmd-Q would never reach keymaps).
winit = "0.30"
# Desktop notifications (works for a binary run from a terminal, outside an app bundle).
mac-notification-sys = "0.6"

[dev-dependencies]
proptest = "1"
